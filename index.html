<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontier · 科学前沿</title><style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b101a;color:#e8edf8}*{box-sizing:border-box}body{margin:0}a{color:#9bbeff;text-decoration:none}button,input,select{font:inherit}button{cursor:pointer}.layout{max-width:1120px;margin:auto;padding:28px 22px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #253148;padding-bottom:22px;gap:16px;flex-wrap:wrap}.logo{font-size:26px;letter-spacing:1px;font-weight:750}.logo span{color:#9bbeff}.muted{color:#93a2bb}.hero{padding:58px 0 28px}.eyebrow{color:#9bbeff;letter-spacing:3px;font-size:12px}.hero h1{font-size:clamp(32px,5vw,56px);line-height:1.17;margin:18px 0}.hero p{max-width:690px;line-height:1.8}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}.pill,select,input{border:1px solid #33435c;background:#141e2d;color:#e8edf8;border-radius:12px;padding:11px 15px}.pill.active{background:#263e66;border-color:#8daeea}.search{flex:1;min-width:200px}.status{margin:20px 0;color:#9daec8;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:16px}.paper{border:1px solid #29384e;background:linear-gradient(150deg,#172234,#101a29);padding:22px;border-radius:17px;display:flex;flex-direction:column;gap:13px;min-height:260px}.paper h3{font-size:18px;line-height:1.5;margin:0}.paper .meta{font-size:12px;color:#9daec8;line-height:1.6}.paper .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{font-size:11px;color:#b9cbeb;background:#263a57;padding:5px 9px;border-radius:8px}.star{background:transparent;border:1px solid #3b4e6a;color:#a8c5ff;border-radius:9px;padding:7px 10px}.section{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:32px 0 14px}footer{border-top:1px solid #27364b;margin-top:56px;padding-top:22px;color:#8495af;font-size:12px;line-height:1.7}dialog{background:#131e2e;color:#e8edf8;border:1px solid #425674;border-radius:18px;padding:25px;max-width:460px;width:90%}dialog::backdrop{background:#0009}label{display:block;margin:14px 0 6px}.full{width:100%}@media(max-width:600px){.hero{padding-top:38px}.layout{padding:20px 15px}}
</style></head><body><div class="layout"><header><div class="logo">FRONTIER<span> / </span></div><nav><button class="pill" id="all">探索论文</button> <button class="pill" id="saved">我的收藏 <span id="count">0</span></button> <button class="pill" id="suggest">推荐期刊</button></nav></header><section class="hero"><div class="eyebrow">DISCOVER WHAT'S NEXT</div><h1>站在科学发现的<br><span style="color:#9bbeff">最前沿。</span></h1><p class="muted">从精选学术期刊中发现值得阅读的研究。聚焦神经科学、脑科学、心理与认知科学、临床医学，以及其他生命科学。论文直接链接至原始来源。</p></section><div class="controls" id="topics"></div><div class="controls"><input class="search" id="search" placeholder="搜索标题、作者、期刊…"><select id="sort"><option value="new">最新发表</option><option value="cited">高被引</option></select><button class="pill" id="refresh">刷新论文</button></div><div class="section"><h2 id="heading">最新研究</h2><span class="muted" id="updated"></span></div><div class="status" id="status">正在获取真实论文…</div><main class="grid" id="papers"></main><footer>Frontier V1 · 论文元数据来自 OpenAlex。所有论文链接跳转至 DOI / 出版方。此版本仅为公开前端原型：收藏保存在当前浏览器，期刊申请尚未接入审核系统；中文译名与个性化推荐仍待开发。</footer></div><dialog id="dialog"><h2>推荐收录期刊</h2><p class="muted">当前为演示功能，申请不会发送至管理员。</p><label>期刊名称</label><input class="full" id="journal" placeholder="Journal name"><label>推荐理由</label><input class="full" id="reason" placeholder="为什么值得收录？"><div class="controls"><button class="pill" id="close">关闭</button><button class="pill active" id="submit">保存本地草稿</button></div></dialog><script>
const topics=['全部','神经科学','脑科学','心理与认知科学','临床医学','其他生命科学'];const journals=[['Nature Neuroscience','https://openalex.org/S137773608'],['Neuron','https://openalex.org/S164826955'],['Nature Human Behaviour','https://openalex.org/S2764861831'],['Brain','https://openalex.org/S134582721'],['Nature Medicine','https://openalex.org/S124433703'],['Cell','https://openalex.org/S110073223'],['Science','https://openalex.org/S3880285']];let papers=[],topic='全部',view='all';const $=id=>document.getElementById(id);let favorites=JSON.parse(localStorage.getItem('frontier-favorites')||'{}');function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function category(p){const s=((p.primary_topic?.display_name||'')+' '+(p.title||'')).toLowerCase();if(/psycholog|cognit|behavio|conscious|memory|attention/.test(s))return '心理与认知科学';if(/brain|neuroimag|cortex|cerebral|fmri/.test(s))return '脑科学';if(/neuro|synap|neuron/.test(s))return '神经科学';if(/clinic|patient|disease|cancer|therap|medicin/.test(s))return '临床医学';return '其他生命科学'}function draw(){const q=$('search').value.trim().toLowerCase();let list=(view==='saved'?Object.values(favorites):papers).filter(p=>(topic==='全部'||category(p)===topic)&&[p.title,p.authorships?.map(a=>a.author?.display_name).join(' '),p.primary_location?.source?.display_name].join(' ').toLowerCase().includes(q));list.sort((a,b)=>$('sort').value==='cited'?(b.cited_by_count||0)-(a.cited_by_count||0):String(b.publication_date).localeCompare(String(a.publication_date)));$('heading').textContent=view==='saved'?'我的收藏':'最新研究';$('count').textContent=Object.keys(favorites).length;$('status').textContent=list.length?'共显示 '+list.length+' 篇论文':'没有匹配的论文。可以更换筛选条件或刷新。';$('papers').innerHTML=list.map(p=>{const id=safe(p.id),url=p.doi||p.primary_location?.landing_page_url||p.id,author=p.authorships?.slice(0,3).map(a=>a.author?.display_name).join(', ')||'作者信息待补充';return '<article class="paper"><span class="tag">'+safe(category(p))+'</span><h3>'+safe(p.title||'Untitled')+'</h3><div class="meta">'+safe(p.primary_location?.source?.display_name||'Journal')+' · '+safe(p.publication_date||'')+'<br>'+safe(author)+'</div><div class="bottom"><a href="'+safe(url)+'" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a><button class="star" data-id="'+id+'">'+(favorites[p.id]?'★ 已收藏':'☆ 收藏')+'</button></div></article>'}).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const p=papers.find(x=>x.id===b.dataset.id)||favorites[b.dataset.id];if(favorites[p.id])delete favorites[p.id];else favorites[p.id]=p;localStorage.setItem('frontier-favorites',JSON.stringify(favorites));draw()})}function tabs(){$('topics').innerHTML=topics.map(t=>'<button class="pill '+(topic===t?'active':'')+'" data-topic="'+t+'">'+t+'</button>').join('');document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;tabs();draw()})}async function load(){view='all';$('status').textContent='正在从 OpenAlex 获取近期论文…';try{const from=new Date(Date.now()-45*86400000).toISOString().slice(0,10);const url='https://api.openalex.org/works?filter=from_publication_date:'+from+',type:article,primary_location.source.id:'+journals.map(j=>j[1].split('/').pop()).join('|')+'&sort=publication_date:desc&per-page=100&select=id,title,doi,publication_date,authorships,primary_location,primary_topic,cited_by_count';const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();papers=(data.results||[]).filter(p=>p.title);$('updated').textContent='更新于 '+new Date().toLocaleString('zh-CN');draw()}catch(e){$('status').textContent='论文数据暂时无法加载（'+e.message+'）。请稍后重试。';$('papers').innerHTML=''}}$('search').oninput=draw;$('sort').onchange=draw;$('refresh').onclick=load;$('all').onclick=()=>{view='all';draw()};$('saved').onclick=()=>{view='saved';draw()};$('suggest').onclick=()=>$('dialog').showModal();$('close').onclick=()=>$('dialog').close();$('submit').onclick=()=>{const n=$('journal').value.trim();if(!n)return alert('请填写期刊名称');const a=JSON.parse(localStorage.getItem('frontier-journal-drafts')||'[]');a.push({name:n,reason:$('reason').value,date:new Date().toISOString()});localStorage.setItem('frontier-journal-drafts',JSON.stringify(a));$('dialog').close();alert('已保存到当前浏览器（尚未提交管理员）')};tabs();load();
</script></body></html>
